    <path d="M235 520 C300 455 330 420 385 360"/>
    <path d="M385 360 C460 320 520 288 596 252"/>
    <path d="M512 525 C565 455 605 400 665 340"/>
    <path d="M665 340 C760 295 830 250 920 205"/>
