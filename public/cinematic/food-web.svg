    <rect x="150" y="465" width="170" height="90" rx="18" fill="#34d39933" stroke="#34d399" stroke-width="5"/><text x="235" y="518" font-size="26" fill="#dcfce7">Grass</text><text x="235" y="545" font-size="16" fill="#86efac">Producer</text>
