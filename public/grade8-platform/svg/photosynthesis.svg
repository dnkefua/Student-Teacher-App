<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, system-ui, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .label { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .formula { font-size: 16px; font-weight: 800; fill: #064e3b; text-anchor: middle; font-family: 'Courier New', monospace; }
    .arrow { stroke: #16a34a; stroke-width: 2.5; fill: none; }
  </style>
  <rect width="800" height="500" fill="#ecfdf5"/>
  <text x="400" y="32" class="title">Photosynthesis — How Plants Make Food</text>
  <text x="400" y="52" font-size="12" fill="#64748b" text-anchor="middle">Plants capture light energy and turn it into chemical energy stored in glucose</text>

  <!-- Sun -->
  <g transform="translate(120 130)">
    <circle r="40" fill="#fde047" stroke="#a16207" stroke-width="2"/>
    <text y="6" font-size="14" font-weight="800" fill="#7c2d12" text-anchor="middle">SUN</text>
    <g stroke="#a16207" stroke-width="2">
      <line x1="-55" y1="0" x2="-44" y2="0"/>
      <line x1="44" y1="0" x2="55" y2="0"/>
      <line x1="0" y1="-55" x2="0" y2="-44"/>
      <line x1="0" y1="44" x2="0" y2="55"/>
      <line x1="-39" y1="-39" x2="-31" y2="-31"/>
      <line x1="31" y1="-31" x2="39" y2="-39"/>
      <line x1="-39" y1="39" x2="-31" y2="31"/>
      <line x1="31" y1="31" x2="39" y2="39"/>
    </g>
  </g>
  <path d="M 165 165 L 320 240" stroke="#fde047" stroke-width="4" fill="none"/>
  <polygon points="320,240 312,236 315,228" fill="#fde047"/>
  <text x="220" y="195" font-size="12" font-weight="800" fill="#a16207">Light energy</text>

  <!-- Plant -->
  <g transform="translate(400 260)">
    <!-- stem -->
    <rect x="-5" y="20" width="10" height="120" fill="#65a30d"/>
    <!-- leaves -->
    <ellipse cx="-50" cy="0" rx="50" ry="25" fill="#16a34a" stroke="#14532d" stroke-width="2" transform="rotate(-20)"/>
    <ellipse cx="50" cy="0" rx="50" ry="25" fill="#16a34a" stroke="#14532d" stroke-width="2" transform="rotate(20)"/>
    <ellipse cx="0" cy="-25" rx="45" ry="22" fill="#22c55e" stroke="#14532d" stroke-width="2"/>
    <!-- roots -->
    <path d="M 0 140 L -30 175 M 0 140 L 30 175 M 0 140 L 0 180 M -20 158 L -45 178 M 20 158 L 45 178"
      stroke="#a16207" stroke-width="3" fill="none"/>
    <!-- soil -->
    <ellipse cx="0" cy="155" rx="80" ry="10" fill="#a16207" opacity="0.4"/>
  </g>

  <!-- CO2 in (left into plant) -->
  <g transform="translate(150 290)">
    <rect width="80" height="36" rx="6" fill="#94a3b8"/>
    <text x="40" y="22" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">CO₂</text>
  </g>
  <path d="M 235 308 L 340 280" class="arrow"/>
  <polygon points="340,280 332,280 335,288" fill="#16a34a"/>
  <text x="252" y="278" font-size="11" font-weight="700" fill="#475569">in through leaves</text>

  <!-- H2O in (root) -->
  <g transform="translate(150 410)">
    <rect width="80" height="36" rx="6" fill="#0ea5e9"/>
    <text x="40" y="22" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">H₂O</text>
  </g>
  <path d="M 235 425 L 365 415" class="arrow"/>
  <polygon points="365,415 357,412 358,420" fill="#16a34a"/>
  <text x="240" y="455" font-size="11" font-weight="700" fill="#475569">absorbed by roots</text>

  <!-- O2 out -->
  <g transform="translate(580 230)">
    <rect width="80" height="36" rx="6" fill="#ef4444"/>
    <text x="40" y="22" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">O₂</text>
  </g>
  <path d="M 480 250 L 575 250" class="arrow"/>
  <polygon points="575,250 567,246 567,254" fill="#16a34a"/>
  <text x="595" y="218" font-size="11" font-weight="700" fill="#475569">out: oxygen released</text>

  <!-- Glucose out -->
  <g transform="translate(580 330)">
    <rect width="100" height="36" rx="6" fill="#f97316"/>
    <text x="50" y="22" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Glucose</text>
  </g>
  <path d="M 480 310 L 575 345" class="arrow"/>
  <polygon points="575,345 567,341 567,349" fill="#16a34a"/>
  <text x="595" y="382" font-size="11" font-weight="700" fill="#475569">stored as starch / energy</text>

  <!-- BIG FORMULA at bottom -->
  <rect x="60" y="445" width="680" height="44" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="473" class="formula">6 CO₂  +  6 H₂O  ──light──&gt;  C₆H₁₂O₆  +  6 O₂</text>
</svg>
