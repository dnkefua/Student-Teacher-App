<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, system-ui, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .org { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .role { font-size: 9px; font-weight: 700; text-anchor: middle; opacity: 0.85; }
    .arrow { stroke: #15803d; stroke-width: 1.8; fill: none; }
    .arrow-faint { stroke: #15803d; stroke-width: 1.2; fill: none; opacity: 0.75; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowhead-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" opacity="0.75"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#f0fdf4"/>
  <text x="450" y="32" class="title">A Food WEB — Many Overlapping Food Chains</text>
  <text x="450" y="52" font-size="12" fill="#64748b" text-anchor="middle">Each arrow points from the organism that is EATEN to the one that EATS it.</text>

  <!-- Sun -->
  <g transform="translate(70 280)">
    <circle r="32" fill="#fde047" stroke="#a16207" stroke-width="2"/>
    <text y="4" font-size="11" font-weight="800" fill="#7c2d12" text-anchor="middle">SUN</text>
    <g stroke="#a16207" stroke-width="1.5">
      <line x1="-45" y1="0" x2="-36" y2="0"/>
      <line x1="36" y1="0" x2="45" y2="0"/>
      <line x1="0" y1="-45" x2="0" y2="-36"/>
      <line x1="0" y1="36" x2="0" y2="45"/>
      <line x1="-32" y1="-32" x2="-26" y2="-26"/>
      <line x1="26" y1="-26" x2="32" y2="-32"/>
      <line x1="-32" y1="32" x2="-26" y2="26"/>
      <line x1="26" y1="26" x2="32" y2="32"/>
    </g>
  </g>

  <!-- PRODUCERS (left column) -->
  <g transform="translate(220 180)">
    <ellipse rx="55" ry="32" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
    <text y="-4" class="org" fill="#fff">Grass</text>
    <text y="10" class="role" fill="#fff">producer</text>
  </g>
  <g transform="translate(220 380)">
    <ellipse rx="55" ry="32" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
    <text y="-4" class="org" fill="#fff">Berries</text>
    <text y="10" class="role" fill="#fff">producer</text>
  </g>

  <!-- PRIMARY consumers (middle column) -->
  <g transform="translate(440 110)">
    <ellipse rx="55" ry="32" fill="#facc15" stroke="#78350f" stroke-width="2"/>
    <text y="-4" class="org" fill="#78350f">Grasshopper</text>
    <text y="10" class="role" fill="#78350f">herbivore</text>
  </g>
  <g transform="translate(440 240)">
    <ellipse rx="55" ry="32" fill="#facc15" stroke="#78350f" stroke-width="2"/>
    <text y="-4" class="org" fill="#78350f">Rabbit</text>
    <text y="10" class="role" fill="#78350f">herbivore</text>
  </g>
  <g transform="translate(440 380)">
    <ellipse rx="55" ry="32" fill="#facc15" stroke="#78350f" stroke-width="2"/>
    <text y="-4" class="org" fill="#78350f">Mouse</text>
    <text y="10" class="role" fill="#78350f">herbivore</text>
  </g>

  <!-- SECONDARY consumers -->
  <g transform="translate(660 110)">
    <ellipse rx="55" ry="32" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
    <text y="-4" class="org" fill="#fff">Frog</text>
    <text y="10" class="role" fill="#fff">carnivore</text>
  </g>
  <g transform="translate(660 240)">
    <ellipse rx="55" ry="32" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
    <text y="-4" class="org" fill="#fff">Snake</text>
    <text y="10" class="role" fill="#fff">carnivore</text>
  </g>
  <g transform="translate(660 380)">
    <ellipse rx="55" ry="32" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
    <text y="-4" class="org" fill="#fff">Owl</text>
    <text y="10" class="role" fill="#fff">carnivore</text>
  </g>

  <!-- APEX predator -->
  <g transform="translate(830 240)">
    <ellipse rx="55" ry="32" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
    <text y="-4" class="org" fill="#fff">Hawk</text>
    <text y="10" class="role" fill="#fff">apex</text>
  </g>

  <!-- DECOMPOSERS -->
  <g transform="translate(440 490)">
    <ellipse rx="65" ry="28" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
    <text y="-2" class="org" fill="#fff">Decomposers</text>
    <text y="12" class="role" fill="#fff">bacteria · fungi</text>
  </g>

  <!-- Sun → producers -->
  <line x1="105" y1="270" x2="170" y2="200" stroke="#fde047" stroke-width="2.5" marker-end="url(#arrowhead-faint)"/>
  <line x1="105" y1="290" x2="170" y2="370" stroke="#fde047" stroke-width="2.5" marker-end="url(#arrowhead-faint)"/>

  <!-- Producers → primary consumers -->
  <line x1="270" y1="170" x2="390" y2="120" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="275" y1="180" x2="390" y2="235" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="365" x2="390" y2="250" class="arrow-faint" marker-end="url(#arrowhead-faint)"/>
  <line x1="275" y1="380" x2="390" y2="378" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Primary → secondary consumers -->
  <line x1="490" y1="105" x2="610" y2="110" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="125" x2="610" y2="225" class="arrow-faint" marker-end="url(#arrowhead-faint)"/>
  <line x1="490" y1="235" x2="610" y2="245" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="255" x2="610" y2="370" class="arrow-faint" marker-end="url(#arrowhead-faint)"/>
  <line x1="490" y1="375" x2="610" y2="245" class="arrow-faint" marker-end="url(#arrowhead-faint)"/>
  <line x1="490" y1="385" x2="610" y2="380" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Secondary → apex -->
  <line x1="710" y1="115" x2="780" y2="225" class="arrow-faint" marker-end="url(#arrowhead-faint)"/>
  <line x1="710" y1="240" x2="780" y2="240" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="710" y1="378" x2="780" y2="260" class="arrow-faint" marker-end="url(#arrowhead-faint)"/>

  <!-- Everything → decomposers (dotted dashed lines) -->
  <g stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.6">
    <path d="M 220 215 Q 380 460 410 480"/>
    <path d="M 220 415 Q 380 470 410 488"/>
    <path d="M 440 145 Q 440 320 440 460"/>
    <path d="M 660 145 Q 600 320 470 470"/>
    <path d="M 660 275 Q 600 380 480 478"/>
    <path d="M 660 412 Q 580 460 478 484"/>
    <path d="M 830 275 Q 700 420 500 485"/>
  </g>
  <text x="600" y="510" font-size="9" font-weight="700" fill="#6d28d9" font-style="italic">↗ dead matter from every level returns to decomposers</text>

  <!-- LEGEND -->
  <rect x="40" y="530" width="820" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <g transform="translate(50 545)" font-size="10">
    <circle r="6" cx="6" cy="0" fill="#16a34a"/>
    <text x="18" y="3" font-weight="700" fill="#0f172a">Producer</text>
    <circle r="6" cx="116" cy="0" fill="#facc15"/>
    <text x="128" y="3" font-weight="700" fill="#0f172a">Primary (herbivore)</text>
    <circle r="6" cx="296" cy="0" fill="#f97316"/>
    <text x="308" y="3" font-weight="700" fill="#0f172a">Secondary (carnivore)</text>
    <circle r="6" cx="488" cy="0" fill="#dc2626"/>
    <text x="500" y="3" font-weight="700" fill="#0f172a">Apex predator</text>
    <circle r="6" cx="610" cy="0" fill="#7c3aed"/>
    <text x="622" y="3" font-weight="700" fill="#0f172a">Decomposer</text>
    <text x="720" y="3" font-style="italic" fill="#475569">arrow = energy direction</text>
  </g>
</svg>
