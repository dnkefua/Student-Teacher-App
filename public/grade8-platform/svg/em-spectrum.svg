<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.15" stop-color="#0ea5e9"/>
      <stop offset="0.35" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#facc15"/>
      <stop offset="0.75" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="vis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.2" stop-color="#3b82f6"/>
      <stop offset="0.4" stop-color="#22c55e"/>
      <stop offset="0.6" stop-color="#facc15"/>
      <stop offset="0.8" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <style>
    .title { font-size: 18px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .label { font-size: 11px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .sub { font-size: 9.5px; fill: #475569; text-anchor: middle; }
    .arrow { stroke: #1e293b; stroke-width: 2; fill: none; }
  </style>
  <rect width="900" height="480" fill="#f1f5f9"/>
  <text x="450" y="32" class="title">The Electromagnetic Spectrum</text>
  <text x="450" y="52" font-size="12" fill="#64748b" text-anchor="middle">Wavelength decreases (and frequency increases) from radio waves on the left to gamma rays on the right</text>

  <!-- spectrum bar -->
  <rect x="60" y="80" width="780" height="48" fill="url(#spec)" stroke="#0f172a"/>

  <!-- 7 region labels -->
  <g>
    <line x1="60" y1="128" x2="60" y2="135" stroke="#0f172a"/>
    <line x1="172" y1="128" x2="172" y2="135" stroke="#0f172a"/>
    <line x1="284" y1="128" x2="284" y2="135" stroke="#0f172a"/>
    <line x1="396" y1="128" x2="396" y2="135" stroke="#0f172a"/>
    <line x1="508" y1="128" x2="508" y2="135" stroke="#0f172a"/>
    <line x1="620" y1="128" x2="620" y2="135" stroke="#0f172a"/>
    <line x1="732" y1="128" x2="732" y2="135" stroke="#0f172a"/>
    <line x1="840" y1="128" x2="840" y2="135" stroke="#0f172a"/>
  </g>
  <text x="116" y="150" class="label">Radio</text>
  <text x="116" y="164" class="sub">TV, broadcast</text>
  <text x="228" y="150" class="label">Micro-</text>
  <text x="228" y="164" class="sub">phones, oven</text>
  <text x="340" y="150" class="label">Infrared</text>
  <text x="340" y="164" class="sub">heat, remote</text>
  <text x="452" y="150" class="label">Visible</text>
  <text x="452" y="164" class="sub">human sight</text>
  <text x="564" y="150" class="label">UV</text>
  <text x="564" y="164" class="sub">sunburn</text>
  <text x="676" y="150" class="label">X-ray</text>
  <text x="676" y="164" class="sub">medical scan</text>
  <text x="788" y="150" class="label">Gamma</text>
  <text x="788" y="164" class="sub">nuclear</text>

  <!-- wavelength scale -->
  <text x="60" y="194" font-size="11" font-weight="700" fill="#1e293b">Wavelength</text>
  <text x="60" y="208" font-size="10" fill="#475569">1 km</text>
  <text x="172" y="208" font-size="10" fill="#475569">1 m</text>
  <text x="284" y="208" font-size="10" fill="#475569">1 mm</text>
  <text x="396" y="208" font-size="10" fill="#475569">700 nm</text>
  <text x="508" y="208" font-size="10" fill="#475569">400 nm</text>
  <text x="620" y="208" font-size="10" fill="#475569">10 nm</text>
  <text x="732" y="208" font-size="10" fill="#475569">0.01 nm</text>

  <!-- big arrows -->
  <path d="M 80 235 L 220 235" class="arrow"/>
  <polygon points="220,235 213,231 213,239" fill="#1e293b"/>
  <text x="150" y="228" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Longer wavelength</text>

  <path d="M 720 235 L 820 235" class="arrow"/>
  <polygon points="820,235 813,231 813,239" fill="#1e293b"/>
  <text x="770" y="228" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Higher frequency &amp; energy</text>

  <!-- visible light zoom -->
  <line x1="396" y1="80" x2="100" y2="290" stroke="#475569" stroke-dasharray="4 4"/>
  <line x1="508" y1="80" x2="800" y2="290" stroke="#475569" stroke-dasharray="4 4"/>
  <rect x="100" y="290" width="700" height="40" fill="url(#vis)" stroke="#0f172a"/>
  <text x="450" y="282" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">Visible light spectrum</text>
  <text x="170" y="356" class="label">Violet</text>
  <text x="270" y="356" class="label">Blue</text>
  <text x="370" y="356" class="label">Green</text>
  <text x="450" y="356" class="label">Yellow</text>
  <text x="550" y="356" class="label">Orange</text>
  <text x="700" y="356" class="label">Red</text>

  <!-- Transverse wave diagram -->
  <g transform="translate(60 380)">
    <path d="M 0 50 L 380 50" stroke="#94a3b8" stroke-dasharray="3 3"/>
    <path d="M 0 50 Q 30 0 60 50 T 120 50 T 180 50 T 240 50 T 300 50 T 360 50"
      fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <!-- wavelength bracket -->
    <line x1="60" y1="20" x2="180" y2="20" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="60" y1="15" x2="60" y2="25" stroke="#dc2626"/>
    <line x1="180" y1="15" x2="180" y2="25" stroke="#dc2626"/>
    <text x="120" y="14" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">wavelength (λ)</text>
    <!-- amplitude -->
    <line x1="30" y1="50" x2="30" y2="0" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="25" y1="0" x2="35" y2="0" stroke="#16a34a"/>
    <text x="40" y="25" font-size="11" font-weight="700" fill="#16a34a">amplitude</text>
    <!-- crest & trough -->
    <text x="30" y="-10" font-size="10" fill="#475569" text-anchor="middle">crest</text>
    <text x="90" y="80" font-size="10" fill="#475569" text-anchor="middle">trough</text>
  </g>

  <text x="450" y="465" font-size="10" font-style="italic" fill="#475569" text-anchor="middle">All EM waves travel at the speed of light in a vacuum: c = 3 × 10⁸ m/s</text>
</svg>
