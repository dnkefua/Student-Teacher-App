<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Inter, system-ui, sans-serif">
  <style>
    .label { font-size: 13px; font-weight: 600; fill: #1e293b; }
    .title { font-size: 18px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .leader { stroke: #475569; stroke-width: 1.2; fill: none; }
    .o2 { fill: #ef4444; }
    .co2 { fill: #1d4ed8; }
    @keyframes lungBreath { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.06); } }
    @keyframes diaphragmDrop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
    .lung-l { transform-origin: 270px 360px; animation: lungBreath 3s ease-in-out infinite; }
    .lung-r { transform-origin: 530px 360px; animation: lungBreath 3s ease-in-out infinite; }
    .diaphragm-anim { transform-origin: 400px 480px; animation: diaphragmDrop 3s ease-in-out infinite; }
  </style>
  <rect width="800" height="540" fill="#ecfeff"/>
  <text x="400" y="32" class="title">The Human Respiratory System</text>
  <text x="400" y="52" font-size="12" fill="#64748b" text-anchor="middle">Air flow: nose → trachea → bronchi → bronchioles → alveoli (gas exchange)</text>

  <!-- nose / mouth -->
  <path d="M 400 80 L 380 110 L 420 110 Z" fill="#fda4af" stroke="#9f1239" stroke-width="2"/>
  <text x="370" y="100" class="label" text-anchor="end">Nose / mouth</text>
  <path class="leader" d="M 368 98 L 388 100"/>

  <!-- trachea -->
  <rect x="385" y="110" width="30" height="130" rx="8" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <text x="640" y="170" class="label" text-anchor="end">Trachea (windpipe)</text>
  <path class="leader" d="M 638 168 L 418 170"/>

  <!-- bronchi -->
  <path d="M 400 240 L 300 290" stroke="#94a3b8" stroke-width="14" stroke-linecap="round"/>
  <path d="M 400 240 L 500 290" stroke="#94a3b8" stroke-width="14" stroke-linecap="round"/>
  <text x="640" y="270" class="label" text-anchor="end">Bronchus → bronchioles</text>
  <path class="leader" d="M 638 268 L 510 285"/>

  <!-- lungs (breathing) -->
  <ellipse cx="270" cy="360" rx="80" ry="115" fill="#fbcfe8" stroke="#be185d" stroke-width="2.5" class="lung-l"/>
  <ellipse cx="530" cy="360" rx="80" ry="115" fill="#fbcfe8" stroke="#be185d" stroke-width="2.5" class="lung-r"/>
  <!-- airways inside lungs -->
  <g stroke="#9f1239" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 300 290 L 270 330 L 240 360"/>
    <path d="M 270 330 L 300 365"/>
    <path d="M 240 360 L 215 395"/>
    <path d="M 240 360 L 235 410"/>
    <path d="M 500 290 L 530 330 L 560 360"/>
    <path d="M 530 330 L 500 365"/>
    <path d="M 560 360 L 585 395"/>
    <path d="M 560 360 L 565 410"/>
  </g>

  <!-- diaphragm (drops on inhale) -->
  <g class="diaphragm-anim">
    <path d="M 180 470 Q 400 510 620 470 L 620 490 Q 400 530 180 490 Z" fill="#fde68a" stroke="#a16207" stroke-width="2"/>
    <text x="400" y="498" font-size="12" font-weight="800" fill="#7c2d12" text-anchor="middle">Diaphragm</text>
  </g>

  <!-- Animated air molecules flowing IN through the trachea -->
  <g>
    <circle r="3.5" fill="#0ea5e9" opacity="0.85">
      <animateMotion dur="3s" repeatCount="indefinite">
        <mpath href="#airIn"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="#38bdf8" opacity="0.75">
      <animateMotion dur="3s" begin="1s" repeatCount="indefinite">
        <mpath href="#airIn"/>
      </animateMotion>
    </circle>
    <path id="airIn" d="M 400 95 L 400 240 L 270 320" fill="none" stroke="none"/>
  </g>
  <g>
    <circle r="3" fill="#38bdf8" opacity="0.75">
      <animateMotion dur="3s" begin="0.5s" repeatCount="indefinite">
        <mpath href="#airInRight"/>
      </animateMotion>
    </circle>
    <path id="airInRight" d="M 400 95 L 400 240 L 530 320" fill="none" stroke="none"/>
  </g>

  <!-- O2 entering the bloodstream at the alveoli -->
  <g>
    <circle r="3.5" fill="#ef4444" opacity="0.85">
      <animateMotion dur="3s" repeatCount="indefinite">
        <mpath href="#o2Diffuse"/>
      </animateMotion>
    </circle>
    <path id="o2Diffuse" d="M 175 345 L 145 345" fill="none" stroke="none"/>
  </g>

  <!-- CO2 leaving the bloodstream and exhaled -->
  <g>
    <circle r="3.5" fill="#1d4ed8" opacity="0.85">
      <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite">
        <mpath href="#co2Diffuse"/>
      </animateMotion>
    </circle>
    <path id="co2Diffuse" d="M 145 390 L 175 390" fill="none" stroke="none"/>
  </g>

  <!-- alveoli detail circle -->
  <g transform="translate(675 370)">
    <circle r="80" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <g stroke="#f43f5e" stroke-width="1.5" fill="#fecdd3">
      <circle cx="-30" cy="-30" r="14"/>
      <circle cx="0" cy="-25" r="12"/>
      <circle cx="25" cy="-35" r="10"/>
      <circle cx="-25" cy="5" r="13"/>
      <circle cx="10" cy="10" r="11"/>
      <circle cx="35" cy="0" r="10"/>
      <circle cx="-15" cy="35" r="12"/>
      <circle cx="20" cy="35" r="11"/>
    </g>
    <text x="0" y="-55" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">Alveoli</text>
    <text x="0" y="65" font-size="10" fill="#334155" text-anchor="middle">gas exchange site</text>
  </g>

  <!-- gas exchange arrows -->
  <g font-size="14" font-weight="800">
    <text x="100" y="350" class="o2">O₂ in</text>
    <path d="M 140 345 L 175 345" stroke="#ef4444" stroke-width="3" fill="none"/>
    <polygon points="175,345 168,340 168,350" fill="#ef4444"/>

    <text x="100" y="395" class="co2">CO₂ out</text>
    <path d="M 175 390 L 140 390" stroke="#1d4ed8" stroke-width="3" fill="none"/>
    <polygon points="140,390 147,385 147,395" fill="#1d4ed8"/>
  </g>

  <!-- inhalation / exhalation note -->
  <rect x="40" y="470" width="220" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="55" y="490" font-size="11" font-weight="800" fill="#0f172a">INHALATION:</text>
  <text x="55" y="504" font-size="11" fill="#334155">Diaphragm contracts → moves DOWN</text>
  <text x="55" y="518" font-size="11" fill="#334155">→ lung volume ↑ → air rushes in</text>
</svg>
