<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Inter, system-ui, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .role { font-size: 12px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .sub { font-size: 10px; fill: #f1f5f9; text-anchor: middle; }
    .org { font-size: 11px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .arrow { stroke: #15803d; stroke-width: 3; fill: none; }
  </style>
  <rect width="900" height="380" fill="#f0fdf4"/>
  <text x="450" y="32" class="title">A Simple Food Chain</text>
  <text x="450" y="52" font-size="12" fill="#64748b" text-anchor="middle">Arrows point in the direction energy flows — from the eaten to the eater</text>

  <!-- Sun -->
  <g transform="translate(70 180)">
    <circle r="30" fill="#fde047" stroke="#a16207" stroke-width="2"/>
    <text y="5" font-size="11" font-weight="800" fill="#7c2d12" text-anchor="middle">SUN</text>
  </g>

  <!-- Grass (producer) -->
  <g transform="translate(220 180)">
    <rect x="-55" y="-55" width="110" height="110" rx="14" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
    <text x="0" y="-25" class="role">Producer</text>
    <text x="0" y="0" font-size="22" text-anchor="middle">🌿</text>
    <text x="0" y="28" class="sub">grass / plants</text>
  </g>

  <!-- Grasshopper (primary consumer / herbivore) -->
  <g transform="translate(390 180)">
    <rect x="-55" y="-55" width="110" height="110" rx="14" fill="#facc15" stroke="#78350f" stroke-width="2"/>
    <text x="0" y="-25" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle">Primary</text>
    <text x="0" y="-10" font-size="10" font-weight="700" fill="#78350f" text-anchor="middle">consumer</text>
    <text x="0" y="14" font-size="22" text-anchor="middle">🦗</text>
    <text x="0" y="34" class="sub" fill="#78350f">grasshopper</text>
  </g>

  <!-- Frog (secondary consumer / carnivore) -->
  <g transform="translate(560 180)">
    <rect x="-55" y="-55" width="110" height="110" rx="14" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
    <text x="0" y="-25" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Secondary</text>
    <text x="0" y="-10" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">consumer</text>
    <text x="0" y="14" font-size="22" text-anchor="middle">🐸</text>
    <text x="0" y="34" class="sub">frog</text>
  </g>

  <!-- Snake (tertiary consumer) -->
  <g transform="translate(730 180)">
    <rect x="-55" y="-55" width="110" height="110" rx="14" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
    <text x="0" y="-25" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Tertiary</text>
    <text x="0" y="-10" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">consumer</text>
    <text x="0" y="14" font-size="22" text-anchor="middle">🐍</text>
    <text x="0" y="34" class="sub">snake</text>
  </g>

  <!-- arrows -->
  <path d="M 105 180 L 160 180" stroke="#fde047" stroke-width="3" fill="none"/>
  <polygon points="160,180 152,175 152,185" fill="#fde047"/>
  <text x="135" y="170" font-size="10" font-weight="700" fill="#a16207" text-anchor="middle">light</text>

  <path d="M 280 180 L 330 180" class="arrow"/>
  <polygon points="335,180 326,175 326,185" fill="#15803d"/>
  <text x="305" y="170" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">eaten by</text>

  <path d="M 450 180 L 500 180" class="arrow"/>
  <polygon points="505,180 496,175 496,185" fill="#15803d"/>
  <text x="475" y="170" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">eaten by</text>

  <path d="M 620 180 L 670 180" class="arrow"/>
  <polygon points="675,180 666,175 666,185" fill="#15803d"/>
  <text x="645" y="170" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">eaten by</text>

  <!-- callout -->
  <rect x="80" y="290" width="740" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="312" font-size="12" font-weight="800" fill="#0f172a">READ THE ARROWS:</text>
  <text x="100" y="330" font-size="12" fill="#334155">"grass → grasshopper" means the grasshopper eats the grass and gains its energy.</text>
  <text x="100" y="345" font-size="12" fill="#334155">A food CHAIN is a single line of who-eats-whom. A food WEB joins many overlapping chains together.</text>
</svg>
