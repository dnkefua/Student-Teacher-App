<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, system-ui, sans-serif">
  <style>
    .title { font-size: 16px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .symbol { font-size: 13px; font-weight: 800; text-anchor: middle; }
    .num { font-size: 8px; font-weight: 700; text-anchor: middle; }
    .name { font-size: 6.5px; text-anchor: middle; }
  </style>
  <rect width="900" height="460" fill="#fafaf9"/>
  <text x="450" y="26" class="title">The Periodic Table — First 20 Elements</text>
  <text x="450" y="44" font-size="11" fill="#64748b" text-anchor="middle">Elements arranged by atomic number; columns share similar chemistry</text>

  <!-- helper: a cell at (x,y) with number, symbol, name, fill -->
  <!-- Period 1 -->
  <g>
    <rect x="60" y="60" width="42" height="48" rx="4" fill="#ef4444" stroke="#7f1d1d"/>
    <text x="81" y="72" class="num" fill="#fff">1</text>
    <text x="81" y="92" class="symbol" fill="#fff">H</text>
    <text x="81" y="104" class="name" fill="#fff">Hydrogen</text>
  </g>
  <g>
    <rect x="816" y="60" width="42" height="48" rx="4" fill="#a855f7" stroke="#581c87"/>
    <text x="837" y="72" class="num" fill="#fff">2</text>
    <text x="837" y="92" class="symbol" fill="#fff">He</text>
    <text x="837" y="104" class="name" fill="#fff">Helium</text>
  </g>

  <!-- Period 2 -->
  <g>
    <rect x="60" y="118" width="42" height="48" rx="4" fill="#f97316" stroke="#7c2d12"/>
    <text x="81" y="130" class="num" fill="#fff">3</text>
    <text x="81" y="150" class="symbol" fill="#fff">Li</text>
    <text x="81" y="162" class="name" fill="#fff">Lithium</text>
  </g>
  <g>
    <rect x="108" y="118" width="42" height="48" rx="4" fill="#fbbf24" stroke="#78350f"/>
    <text x="129" y="130" class="num">4</text>
    <text x="129" y="150" class="symbol">Be</text>
    <text x="129" y="162" class="name">Beryllium</text>
  </g>
  <!-- gap -->
  <g>
    <rect x="540" y="118" width="42" height="48" rx="4" fill="#10b981" stroke="#064e3b"/>
    <text x="561" y="130" class="num" fill="#fff">5</text>
    <text x="561" y="150" class="symbol" fill="#fff">B</text>
    <text x="561" y="162" class="name" fill="#fff">Boron</text>
  </g>
  <g>
    <rect x="588" y="118" width="42" height="48" rx="4" fill="#10b981" stroke="#064e3b"/>
    <text x="609" y="130" class="num" fill="#fff">6</text>
    <text x="609" y="150" class="symbol" fill="#fff">C</text>
    <text x="609" y="162" class="name" fill="#fff">Carbon</text>
  </g>
  <g>
    <rect x="636" y="118" width="42" height="48" rx="4" fill="#10b981" stroke="#064e3b"/>
    <text x="657" y="130" class="num" fill="#fff">7</text>
    <text x="657" y="150" class="symbol" fill="#fff">N</text>
    <text x="657" y="162" class="name" fill="#fff">Nitrogen</text>
  </g>
  <g>
    <rect x="684" y="118" width="42" height="48" rx="4" fill="#10b981" stroke="#064e3b"/>
    <text x="705" y="130" class="num" fill="#fff">8</text>
    <text x="705" y="150" class="symbol" fill="#fff">O</text>
    <text x="705" y="162" class="name" fill="#fff">Oxygen</text>
  </g>
  <g>
    <rect x="732" y="118" width="42" height="48" rx="4" fill="#06b6d4" stroke="#164e63"/>
    <text x="753" y="130" class="num" fill="#fff">9</text>
    <text x="753" y="150" class="symbol" fill="#fff">F</text>
    <text x="753" y="162" class="name" fill="#fff">Fluorine</text>
  </g>
  <g>
    <rect x="780" y="118" width="42" height="48" rx="4" fill="#a855f7" stroke="#581c87"/>
    <text x="801" y="130" class="num" fill="#fff">10</text>
    <text x="801" y="150" class="symbol" fill="#fff">Ne</text>
    <text x="801" y="162" class="name" fill="#fff">Neon</text>
  </g>

  <!-- Period 3 -->
  <g>
    <rect x="60" y="176" width="42" height="48" rx="4" fill="#f97316" stroke="#7c2d12"/>
    <text x="81" y="188" class="num" fill="#fff">11</text>
    <text x="81" y="208" class="symbol" fill="#fff">Na</text>
    <text x="81" y="220" class="name" fill="#fff">Sodium</text>
  </g>
  <g>
    <rect x="108" y="176" width="42" height="48" rx="4" fill="#fbbf24" stroke="#78350f"/>
    <text x="129" y="188" class="num">12</text>
    <text x="129" y="208" class="symbol">Mg</text>
    <text x="129" y="220" class="name">Magnesium</text>
  </g>
  <g>
    <rect x="540" y="176" width="42" height="48" rx="4" fill="#10b981" stroke="#064e3b"/>
    <text x="561" y="188" class="num" fill="#fff">13</text>
    <text x="561" y="208" class="symbol" fill="#fff">Al</text>
    <text x="561" y="220" class="name" fill="#fff">Aluminium</text>
  </g>
  <g>
    <rect x="588" y="176" width="42" height="48" rx="4" fill="#10b981" stroke="#064e3b"/>
    <text x="609" y="188" class="num" fill="#fff">14</text>
    <text x="609" y="208" class="symbol" fill="#fff">Si</text>
    <text x="609" y="220" class="name" fill="#fff">Silicon</text>
  </g>
  <g>
    <rect x="636" y="176" width="42" height="48" rx="4" fill="#10b981" stroke="#064e3b"/>
    <text x="657" y="188" class="num" fill="#fff">15</text>
    <text x="657" y="208" class="symbol" fill="#fff">P</text>
    <text x="657" y="220" class="name" fill="#fff">Phosphorus</text>
  </g>
  <g>
    <rect x="684" y="176" width="42" height="48" rx="4" fill="#10b981" stroke="#064e3b"/>
    <text x="705" y="188" class="num" fill="#fff">16</text>
    <text x="705" y="208" class="symbol" fill="#fff">S</text>
    <text x="705" y="220" class="name" fill="#fff">Sulfur</text>
  </g>
  <g>
    <rect x="732" y="176" width="42" height="48" rx="4" fill="#06b6d4" stroke="#164e63"/>
    <text x="753" y="188" class="num" fill="#fff">17</text>
    <text x="753" y="208" class="symbol" fill="#fff">Cl</text>
    <text x="753" y="220" class="name" fill="#fff">Chlorine</text>
  </g>
  <g>
    <rect x="780" y="176" width="42" height="48" rx="4" fill="#a855f7" stroke="#581c87"/>
    <text x="801" y="188" class="num" fill="#fff">18</text>
    <text x="801" y="208" class="symbol" fill="#fff">Ar</text>
    <text x="801" y="220" class="name" fill="#fff">Argon</text>
  </g>

  <!-- Period 4 (just first two) -->
  <g>
    <rect x="60" y="234" width="42" height="48" rx="4" fill="#f97316" stroke="#7c2d12"/>
    <text x="81" y="246" class="num" fill="#fff">19</text>
    <text x="81" y="266" class="symbol" fill="#fff">K</text>
    <text x="81" y="278" class="name" fill="#fff">Potassium</text>
  </g>
  <g>
    <rect x="108" y="234" width="42" height="48" rx="4" fill="#fbbf24" stroke="#78350f"/>
    <text x="129" y="246" class="num">20</text>
    <text x="129" y="266" class="symbol">Ca</text>
    <text x="129" y="278" class="name">Calcium</text>
  </g>

  <!-- group labels -->
  <text x="81" y="310" font-size="11" font-weight="700" fill="#7c2d12" text-anchor="middle">Group 1</text>
  <text x="81" y="322" font-size="9" fill="#7c2d12" text-anchor="middle">Alkali metals</text>
  <text x="129" y="310" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">Group 2</text>
  <text x="129" y="322" font-size="9" fill="#78350f" text-anchor="middle">Alkaline earth</text>
  <text x="753" y="310" font-size="11" font-weight="700" fill="#164e63" text-anchor="middle">Group 17</text>
  <text x="753" y="322" font-size="9" fill="#164e63" text-anchor="middle">Halogens</text>
  <text x="801" y="310" font-size="11" font-weight="700" fill="#581c87" text-anchor="middle">Group 18</text>
  <text x="801" y="322" font-size="9" fill="#581c87" text-anchor="middle">Noble gases</text>

  <!-- LEGEND -->
  <rect x="60" y="350" width="780" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="450" y="370" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">Reading a cell: atomic number on top, element symbol in the middle, name below</text>
  <g transform="translate(110 388)">
    <rect width="20" height="14" fill="#f97316"/><text x="28" y="11" font-size="10" font-weight="700" fill="#0f172a">Alkali metal</text>
    <rect x="120" width="20" height="14" fill="#fbbf24"/><text x="148" y="11" font-size="10" font-weight="700" fill="#0f172a">Alkaline earth</text>
    <rect x="260" width="20" height="14" fill="#10b981"/><text x="288" y="11" font-size="10" font-weight="700" fill="#0f172a">Non-metal</text>
    <rect x="380" width="20" height="14" fill="#06b6d4"/><text x="408" y="11" font-size="10" font-weight="700" fill="#0f172a">Halogen</text>
    <rect x="490" width="20" height="14" fill="#a855f7"/><text x="518" y="11" font-size="10" font-weight="700" fill="#0f172a">Noble gas</text>
    <rect x="610" width="20" height="14" fill="#ef4444"/><text x="638" y="11" font-size="10" font-weight="700" fill="#0f172a">Hydrogen</text>
  </g>
  <text x="450" y="430" font-size="10" fill="#475569" text-anchor="middle">Periods (rows) tell you how many electron shells the atom uses. Groups (columns) tell you how many outer electrons it has.</text>
</svg>
