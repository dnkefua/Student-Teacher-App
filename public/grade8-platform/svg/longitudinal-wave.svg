<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, system-ui, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .label { font-size: 12px; font-weight: 700; }
  </style>
  <rect width="800" height="360" fill="#fff7ed"/>
  <text x="400" y="32" class="title">Longitudinal Wave — Compressions and Rarefactions</text>
  <text x="400" y="52" font-size="12" fill="#64748b" text-anchor="middle">Particles oscillate parallel to the direction of energy transfer (e.g. sound waves)</text>

  <!-- particles (denser = compression, sparser = rarefaction) -->
  <g fill="#f97316" stroke="#7c2d12">
    <!-- COMPRESSION 1 -->
    <circle cx="90" cy="175" r="6"/>
    <circle cx="105" cy="175" r="6"/>
    <circle cx="120" cy="175" r="6"/>
    <circle cx="135" cy="175" r="6"/>
    <!-- rarefaction -->
    <circle cx="175" cy="175" r="6"/>
    <circle cx="210" cy="175" r="6"/>
    <circle cx="245" cy="175" r="6"/>
    <!-- COMPRESSION 2 -->
    <circle cx="280" cy="175" r="6"/>
    <circle cx="295" cy="175" r="6"/>
    <circle cx="310" cy="175" r="6"/>
    <circle cx="325" cy="175" r="6"/>
    <!-- rarefaction -->
    <circle cx="365" cy="175" r="6"/>
    <circle cx="400" cy="175" r="6"/>
    <circle cx="435" cy="175" r="6"/>
    <!-- COMPRESSION 3 -->
    <circle cx="470" cy="175" r="6"/>
    <circle cx="485" cy="175" r="6"/>
    <circle cx="500" cy="175" r="6"/>
    <circle cx="515" cy="175" r="6"/>
    <!-- rarefaction -->
    <circle cx="555" cy="175" r="6"/>
    <circle cx="590" cy="175" r="6"/>
    <circle cx="625" cy="175" r="6"/>
    <!-- COMPRESSION 4 -->
    <circle cx="660" cy="175" r="6"/>
    <circle cx="675" cy="175" r="6"/>
    <circle cx="690" cy="175" r="6"/>
    <circle cx="705" cy="175" r="6"/>
  </g>

  <!-- labels -->
  <text x="112" y="145" font-size="11" font-weight="800" fill="#7f1d1d" text-anchor="middle">compression</text>
  <text x="210" y="145" font-size="11" font-weight="800" fill="#1e293b" text-anchor="middle">rarefaction</text>
  <text x="302" y="145" font-size="11" font-weight="800" fill="#7f1d1d" text-anchor="middle">compression</text>

  <!-- wavelength: distance between two compressions -->
  <line x1="112" y1="220" x2="302" y2="220" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="112" y1="214" x2="112" y2="226" stroke="#dc2626"/>
  <line x1="302" y1="214" x2="302" y2="226" stroke="#dc2626"/>
  <text x="207" y="240" class="label" fill="#dc2626" text-anchor="middle">wavelength (λ) = distance between two compressions</text>

  <!-- direction arrow -->
  <path d="M 720 175 L 750 175" stroke="#0f172a" stroke-width="2"/>
  <polygon points="750,175 742,171 742,179" fill="#0f172a"/>
  <text x="745" y="165" font-size="11" font-weight="700" fill="#0f172a" text-anchor="end">direction →</text>

  <!-- example -->
  <rect x="60" y="270" width="680" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="290" font-size="11" font-weight="800" fill="#0f172a">EXAMPLE:</text>
  <text x="80" y="308" font-size="11" fill="#334155">Sound is a longitudinal wave. It needs a medium (air, water, solid) to travel because particles must</text>
  <text x="80" y="322" font-size="11" fill="#334155">bunch and spread to pass the energy along. Sound cannot travel through a vacuum.</text>
</svg>
