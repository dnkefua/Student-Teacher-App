<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, system-ui, sans-serif">
  <style>
    .label { font-size: 13px; font-weight: 600; fill: #1e293b; }
    .title { font-size: 18px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .leader { stroke: #475569; stroke-width: 1.2; fill: none; }
    .dot { fill: #475569; }
    .organ { stroke: #b45309; stroke-width: 2; }
  </style>
  <rect width="800" height="600" fill="#fff7ed"/>
  <text x="400" y="34" class="title">The Human Digestive System</text>
  <text x="400" y="54" font-size="12" fill="#64748b" text-anchor="middle">Mouth → Esophagus → Stomach → Small Intestine → Large Intestine → Rectum</text>

  <!-- silhouette -->
  <path d="M 400 90 C 350 90 330 120 330 150 C 330 180 350 195 380 200 L 380 220 L 280 240 C 250 250 240 290 250 330 L 250 470 C 250 530 290 560 320 560 L 480 560 C 510 560 550 530 550 470 L 550 330 C 560 290 550 250 520 240 L 420 220 L 420 200 C 450 195 470 180 470 150 C 470 120 450 90 400 90 Z"
    fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>

  <!-- Mouth -->
  <ellipse cx="400" cy="140" rx="36" ry="14" fill="#fda4af" class="organ"/>
  <text x="400" y="144" font-size="10" font-weight="700" fill="#7f1d1d" text-anchor="middle">MOUTH</text>

  <!-- Esophagus -->
  <rect x="392" y="158" width="16" height="84" rx="4" fill="#fbcfe8" class="organ"/>

  <!-- Stomach -->
  <path d="M 360 250 Q 350 270 360 310 Q 380 340 430 330 Q 460 320 455 290 Q 450 260 420 252 Z" fill="#fb923c" class="organ"/>
  <text x="405" y="295" font-size="11" font-weight="800" fill="#7c2d12" text-anchor="middle">Stomach</text>

  <!-- Liver -->
  <path d="M 300 270 Q 295 290 305 310 L 355 310 L 360 290 L 340 270 Z" fill="#a16207" class="organ"/>
  <text x="328" y="295" font-size="10" font-weight="700" fill="#fef3c7" text-anchor="middle">Liver</text>

  <!-- Pancreas -->
  <ellipse cx="425" cy="345" rx="35" ry="10" fill="#fde047" class="organ" transform="rotate(-12 425 345)"/>
  <text x="425" y="349" font-size="9" font-weight="700" fill="#713f12" text-anchor="middle">Pancreas</text>

  <!-- Small intestine: coiled -->
  <path d="M 380 360 C 330 370 320 400 360 420 C 410 430 430 405 430 380 C 430 410 470 420 460 450 C 440 480 380 470 360 490"
    stroke="#dc2626" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Large intestine: U-frame -->
  <path d="M 320 360 L 320 470 L 320 500 L 480 500 L 480 470 L 480 360 L 460 360 L 460 480 L 340 480 L 340 360 Z"
    fill="none" stroke="#65a30d" stroke-width="12" stroke-linejoin="round"/>

  <!-- Rectum -->
  <rect x="392" y="510" width="16" height="36" fill="#7c2d12" class="organ"/>

  <!-- LABELS LEFT -->
  <text x="170" y="142" class="label">1. Mouth — chews food &amp; mixes with saliva</text>
  <path class="leader" d="M 360 140 L 305 140"/>

  <text x="170" y="200" class="label">2. Esophagus — peristalsis pushes food down</text>
  <path class="leader" d="M 388 200 L 305 200"/>

  <text x="170" y="295" class="label">3. Stomach — acid &amp; enzymes break protein</text>
  <path class="leader" d="M 358 290 L 305 295"/>

  <!-- LABELS RIGHT -->
  <text x="630" y="295" class="label">Liver — produces bile</text>
  <path class="leader" d="M 625 292 L 545 290"/>

  <text x="630" y="350" class="label">Pancreas — releases enzymes</text>
  <path class="leader" d="M 625 348 L 470 345"/>

  <text x="630" y="410" class="label">4. Small intestine — nutrients absorbed</text>
  <path class="leader" d="M 625 408 L 470 410"/>

  <text x="630" y="475" class="label">5. Large intestine — water absorbed</text>
  <path class="leader" d="M 625 473 L 495 475"/>

  <text x="630" y="535" class="label">6. Rectum — waste exits</text>
  <path class="leader" d="M 625 533 L 415 530"/>
</svg>
